name: Agari Data
description: >-
  Agari Data (now part of Fortra Email Security) is an enterprise email security company that uses
  AI-driven identity intelligence and DMARC email authentication to stop advanced email attacks such
  as phishing, business email compromise (BEC), and brand impersonation. The Agari Platform API gives
  developers and security teams programmatic, OAuth 2.0 secured access to Cloud Email Protection and
  Brand Protection (DMARC) data — including monitored messages, policy events, and threat telemetry —
  so events can be ingested into SIEM/SOAR tools like Splunk and Microsoft Sentinel. The RESTful API
  returns JSON, is versioned under a URI path (v1), and is split by product (Cloud Email Protection
  under /ep, Brand Protection under /cp) with US and EU regional endpoints. Originally founded as
  Agari Data and later acquired into HelpSystems/Fortra, it was surfaced as a portfolio company of
  Battery Ventures.
